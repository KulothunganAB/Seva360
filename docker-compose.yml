version: '3.8'

services:
  backend:
    build: ./backend
    container_name: seva360-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-seva360_production_secret_change_this}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-seva360_refresh_secret_change_this}
      - CLIENT_URL=http://localhost:5173
    volumes:
      - ./backend/database:/app/database
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: seva360-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - VITE_SOCKET_URL=http://localhost:5000
    restart: unless-stopped

networks:
  default:
    name: seva360-network
